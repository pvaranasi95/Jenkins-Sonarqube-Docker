apiVersion: apps/v1
kind: Deployment
metadata:
   name: onixweb
   labels:
    app: onixweb
spec:
   selector:
     matchLabels:
       app: onixweb
   replicas: 3
   template:
     metadata:
      lables:
        app: onixweb
     specs:
       containers:
       - name: onixweb
         image: pvaranasi/onixweb:17
         ports: 
         - containerPort: 8088
    
